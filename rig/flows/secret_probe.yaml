id: secret_probe
namespace: hko.system
description: Resolve both OSS secrets without printing either value.
tasks:
  - id: resolve_secrets
    type: io.kestra.plugin.core.debug.Return
    format: "{{ (secret('HERMES_WEBHOOK_URL') | length) > 0 and (secret('HERMES_WEBHOOK_TOKEN') | length) >= 16 }}"
